server:
  port: 8012
  servlet:
    context-path: /noblewalk/v1

spring:
  application:
    name: backend
  mvc:
    path match:
      matching-strategy: ant-path-matcher

  data:
    mongodb:
      user: admin
      password: admin
      database: medicus-connect
      uri: mongodb://localhost:27017

config:
  rest:
    service:
      profile-url: ""
      messaging-url: ""

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic